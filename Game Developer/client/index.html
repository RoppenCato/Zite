<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b1f2a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/pwa-192x192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <title>Zite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The two faces of the UI kit (Mitch, AD, 2026-11-01): Fredoka for titles and numbers, Nunito for lines; both SIL Open Font License. -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1f2a;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #game {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
      }
      /* Phaser's DOM layer (the name field) is laid out at the canvas's pixel size and scaled down by a transform; the
         flex centring above centres that larger box, so the transform must shrink it about its centre to sit on the canvas. */
      #game > div {
        transform-origin: center center !important;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
